name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release from this build'
        type: boolean
        default: false
      release_version:
        description: 'Version to stamp this release as'
        type: string
        default: v0.1.0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            shell: bash
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
          - name: win64
            runner: windows-latest
            shell: msys2 {0}
          - name: macos-universal
            runner: macos-latest
            shell: bash
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'

    defaults:
      run:
        shell: ${{matrix.shell}}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libsndio-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      # Win64
      - name: Install build dependencies (Win64)
        if: runner.os == 'Windows'  
        uses: msys2/setup-msys2@v2
        with:
            msystem: UCRT64
            update: true
            install: mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gcc zip

      - name: Set variables based on OS (Windows)
        if: runner.os == 'Windows'
        run: echo "ARCHIVE_EXTENSION=zip" >> $GITHUB_ENV

      - name: Set variables based on OS (non-Windows)
        if: runner.os != 'Windows'
        run: echo "ARCHIVE_EXTENSION=tar.gz" >> $GITHUB_ENV

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install tree
        run: cmake --install build --prefix "dist/motion-build${{github.run_number}}-${{ matrix.name }}"

      - name: Package (tarball)
        if: runner.os != 'Windows'
        run: tar -czf "motion-build${{github.run_number}}-${{ matrix.name }}.tar.gz" -C dist "motion-build${{github.run_number}}-${{ matrix.name }}"

      - name: Package (zip file)
        if: runner.os == 'Windows'
        run: zip -r "motion-build${{github.run_number}}-${{ matrix.name }}.zip" "dist/motion-build${{github.run_number}}-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: motion-build${{github.run_number}}-${{ matrix.name }}
          path: motion-build${{github.run_number}}-${{ matrix.name }}.${{env.ARCHIVE_EXTENSION}}
          if-no-files-found: error

  release:
    name: release
    needs: native
    runs-on: ubuntu-24.04

    if: ${{ inputs.release }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute datestamp
        id: version
        run: echo "version=${{inputs.release_version}}.${{github.run_number}}" >> "$GITHUB_OUTPUT"

      - name: Name archives 
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for f in artifacts/*.tar.gz; do
            platform="$(basename "$f" .tar.gz)"
            platform="${platform#motion-}"
            cp "$f" "release/motion-${VERSION}-${platform}.tar.gz"
          done
          for f in artifacts/*.zip; do
            platform="$(basename "$f" .zip)"
            platform="${platform#motion-}"
            cp "$f" "release/motion-${VERSION}-${platform}.zip"
          done 
          cd release && sha256sum *.tar.gz && sha256sum *.zip | tee SHA256SUMS
        
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "motion $VERSION" \
            --notes "$(printf '%s\n' \
              '### macOS' \
              '' \
              'These builds are unsigned, so macOS may refuse to run them with "Apple could not verify motion is free of malware". In order to fix this, clear the quarantine flag:' \
              '' \
              '```sh' \
              'xattr -d com.apple.quarantine motion' \
              '```')" \
            --generate-notes \
            release/*
